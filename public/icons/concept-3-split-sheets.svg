<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="sheet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sheet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad-3)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1f2937" stroke-width="3" />

  <!-- Back Sheet (Right Compare File) -->
  <g filter="url(#card-shadow)" opacity="0.85">
    <path d="M 220 90 L 370 90 L 420 140 L 420 380 Q 420 400 400 400 L 220 400 Q 200 400 200 380 L 200 110 Q 200 90 220 90 Z" fill="url(#sheet-right)" stroke="#475569" stroke-width="3" />
    <polygon points="370,90 420,140 370,140" fill="#64748b" />
    <!-- Back Sheet Code Lines -->
    <rect x="235" y="170" width="140" height="10" rx="5" fill="#64748b" opacity="0.6" />
    <rect x="235" y="195" width="110" height="10" rx="5" fill="#64748b" opacity="0.6" />
    <rect x="235" y="230" width="150" height="12" rx="6" fill="#a855f7" />
    <rect x="235" y="255" width="90" height="12" rx="6" fill="#a855f7" />
    <rect x="235" y="290" width="130" height="10" rx="5" fill="#64748b" opacity="0.6" />
  </g>

  <!-- Front Sheet (Left Compare File) -->
  <g filter="url(#card-shadow)">
    <path d="M 112 130 L 262 130 L 312 180 L 312 420 Q 312 440 292 440 L 112 440 Q 92 440 92 420 L 92 150 Q 92 130 112 130 Z" fill="url(#sheet-left)" stroke="#3b82f6" stroke-width="4" />
    <polygon points="262,130 312,180 262,180" fill="#1d4ed8" />
    <!-- Front Sheet Code Lines -->
    <rect x="127" y="210" width="140" height="10" rx="5" fill="#64748b" opacity="0.6" />
    <rect x="127" y="235" width="100" height="10" rx="5" fill="#64748b" opacity="0.6" />
    <!-- Diff Red/Cyan Line -->
    <rect x="127" y="270" width="155" height="14" rx="7" fill="#38bdf8" />
    <rect x="127" y="298" width="115" height="14" rx="7" fill="#38bdf8" />
    <rect x="127" y="336" width="130" height="10" rx="5" fill="#64748b" opacity="0.6" />
    <rect x="127" y="360" width="80" height="10" rx="5" fill="#64748b" opacity="0.6" />
  </g>

  <!-- Defex Floating Transfer Badge -->
  <g filter="url(#card-shadow)">
    <circle cx="360" cy="360" r="50" fill="url(#blue-glow)" stroke="#ffffff" stroke-width="4" />
    <!-- ⇄ Transfer Arrow Symbol -->
    <path d="M 340 350 L 378 350 M 368 342 L 378 350 L 368 358" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 380 370 L 342 370 M 352 362 L 342 370 L 352 378" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
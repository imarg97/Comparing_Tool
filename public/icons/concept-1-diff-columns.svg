<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="left-pane-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad-1)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />

  <!-- Left Compare Pane -->
  <g filter="url(#glow)">
    <rect x="76" y="106" width="160" height="300" rx="20" fill="url(#left-pane-grad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.5" />
    <!-- Line bars -->
    <rect x="100" y="146" width="112" height="12" rx="6" fill="#475569" opacity="0.6" />
    <rect x="100" y="174" width="80" height="12" rx="6" fill="#475569" opacity="0.6" />
    <!-- Diff highlighted block -->
    <rect x="92" y="210" width="128" height="60" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="2" />
    <rect x="100" y="222" width="104" height="12" rx="6" fill="url(#cyan-accent)" />
    <rect x="100" y="246" width="76" height="12" rx="6" fill="url(#cyan-accent)" />
    <!-- Unchanged lines -->
    <rect x="100" y="294" width="100" height="12" rx="6" fill="#475569" opacity="0.6" />
    <rect x="100" y="322" width="60" height="12" rx="6" fill="#475569" opacity="0.6" />
    <rect x="100" y="350" width="90" height="12" rx="6" fill="#475569" opacity="0.6" />
  </g>

  <!-- Right Compare Pane -->
  <g>
    <rect x="276" y="106" width="160" height="300" rx="20" fill="url(#left-pane-grad)" stroke="#a855f7" stroke-width="4" stroke-opacity="0.5" />
    <!-- Line bars -->
    <rect x="300" y="146" width="112" height="12" rx="6" fill="#475569" opacity="0.6" />
    <rect x="300" y="174" width="80" height="12" rx="6" fill="#475569" opacity="0.6" />
    <!-- Diff highlighted block -->
    <rect x="292" y="210" width="128" height="60" rx="10" fill="#701a75" fill-opacity="0.3" stroke="#c084fc" stroke-width="2" />
    <rect x="300" y="222" width="112" height="12" rx="6" fill="url(#purple-accent)" />
    <rect x="300" y="246" width="88" height="12" rx="6" fill="url(#purple-accent)" />
    <!-- Unchanged lines -->
    <rect x="300" y="294" width="100" height="12" rx="6" fill="#475569" opacity="0.6" />
    <rect x="300" y="322" width="60" height="12" rx="6" fill="#475569" opacity="0.6" />
    <rect x="300" y="350" width="90" height="12" rx="6" fill="#475569" opacity="0.6" />
  </g>

  <!-- Central Gutter / Transfer Chevrons -->
  <circle cx="256" cy="240" r="28" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <!-- Transfer arrows -->
  <path d="M 246 233 L 262 233 M 256 227 L 262 233 L 256 239" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 266 247 L 250 247 M 256 241 L 250 247 L 256 253" fill="none" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>